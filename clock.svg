<svg xmlns="http://www.w3.org/2000/svg" width="160" height="36" viewBox="0 0 160 36">
  <style>
    @keyframes sec-loop {
      0% { transform: translateY(0); }
      100% { transform: translateY(-1800px); } /* 60 * 30px */
    }
    @keyframes min-loop {
      0% { transform: translateY(0); }
      100% { transform: translateY(-1800px); } /* 60 * 30px */
    }
    @keyframes hour-loop {
      0% { transform: translateY(0); }
      100% { transform: translateY(-720px); } /* 24 * 30px */
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .clock-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Fira Code', monospace;
      font-size: 26px;
      font-weight: 700;
      fill: #00F5FF;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.5);
    }

    .col-hour {
      animation: hour-loop 86400s steps(24) infinite;
      animation-delay: -6259s;
    }
    .col-min {
      animation: min-loop 3600s steps(60) infinite;
      animation-delay: -2659s;
    }
    .col-sec {
      animation: sec-loop 60s steps(60) infinite;
      animation-delay: -19s;
    }
    .dots {
      animation: blink 1s infinite;
      fill: #00F5FF;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000" rx="6" />
  
  <g class="clock-text">
    <!-- Hour Column -->
    <g transform="translate(15, 28)">
      <g class="col-hour">
        <text x="0" y="0">00</text>
        <text x="0" y="30">01</text>
        <text x="0" y="60">02</text>
